# Artekit AK-LINK, FT2232D JTAG adapter
# https://www.artekit.eu/products/debug/ak-link-jtag/
#
# Same FT2232D wiring as the AK-LINK-2 (ak-link-2.cfg from Artekit).
# JTAG only: no SWD, no RTCK. Pin 3 of the 20-pin connector (nTRST) is not wired.

adapter driver ftdi
ftdi device_desc "AK-LINK JTAG Adapter"
ftdi vid_pid 0x0403 0x6010
ftdi channel 0

ftdi layout_init 0x0008 0x0c7b
ftdi layout_signal nSRST -oe 0x0040
ftdi layout_signal LED -ndata 0x0c00

transport select jtag
reset_config srst_only
